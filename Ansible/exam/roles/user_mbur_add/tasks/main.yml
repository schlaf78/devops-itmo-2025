- name: User Creation
  ansible.builtin.user:
    name: mbur
    shell: /bin/bash
    create_home: yes

- name: SSH Add
  ansible.posix.authorized_key:
    user: mbur
    state: present
    key: "{{ lookup('file', '/Users/m.burmistrov/.ssh/autumn2025.pub') }}"

- name: Sudo Escalation NO PASSWD
  community.general.sudoers:
    name: mbir_nopassd
    user: mbur
    commands: ALL
    nopassword: true
    state: present

