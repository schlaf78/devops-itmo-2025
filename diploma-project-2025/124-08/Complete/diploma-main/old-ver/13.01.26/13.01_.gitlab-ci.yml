stages:
  - build
  - deploy

variables:
  REGISTRY: "registry.internal:5000"
  IMAGE_NAME: "test/app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  FULL_IMAGE: "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

# =========================
# BUILD (VM2: runner-region-d)
# =========================
build:
  stage: build
  tags:
    - docker
  image: docker:29.1
  script:
    - echo "Login to registry (VM3)"
    - docker login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"

    - echo "Build image: $FULL_IMAGE (context: app/)"
    - docker build -t "$FULL_IMAGE" app/

    - echo "Push image: $FULL_IMAGE"
    - docker push "$FULL_IMAGE"
  only:
    - main

# =========================
# DEPLOY (VM4: deploy-region-d, 10.130.0.27)
# =========================
deploy:
  stage: deploy
  tags:
    - docker
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - cp /ssh/gitlab_runner_to_deploy ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan deploy-region-d >> ~/.ssh/known_hosts

  script:
    - |
      ssh mburmistrov@deploy-region-d << EOF
        set -e

        echo "[VM4] Go to compose dir: /home/mburmistrov/deploy/nginx"
        cd /home/mburmistrov/deploy/nginx

        echo "[VM4] Write .env next to docker-compose.yml"
        echo "IMAGE_TAG=$CI_COMMIT_SHORT_SHA" > .env

        echo "[VM4] Login to registry"
        docker login registry.internal:5000 -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"

        echo "[VM4] Deploy: compose pull + up"
        docker compose pull
        docker compose up -d

        echo "[VM4] Containers:"
        docker ps
      EOF
  only:
    - main
