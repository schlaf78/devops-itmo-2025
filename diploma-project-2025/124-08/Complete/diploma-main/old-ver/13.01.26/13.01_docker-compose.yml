version: "3.9"

services:

  # =========================
  # DATABASE (MySQL)
  # =========================
  db:
    image: mysql:8
    container_name: diploma-db

    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always


  # =========================
  # APPLICATION (Flask)
  # =========================
  app:
    image: registry.internal:5000/test/app:${IMAGE_TAG}
    container_name: diploma-app

    environment:
      IMAGE_TAG: ${IMAGE_TAG}

    depends_on:
      - db

    restart: always


  # =========================
  # NGINX (Reverse Proxy)
  # =========================
  nginx:
    image: nginx:alpine
    container_name: diploma-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app

    restart: always


# =========================
# PERSISTENT VOLUMES
# =========================
volumes:
  mysql_data:
