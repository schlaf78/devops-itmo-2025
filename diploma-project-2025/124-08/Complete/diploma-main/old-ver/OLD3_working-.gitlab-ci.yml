stages:
  - build
  - deploy

variables:
  REGISTRY: registry.internal:5000
  IMAGE_NAME: test/nginx
  IMAGE_TAG: latest
  FULL_IMAGE: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

# =========================
# BUILD STAGE (VM2)
# =========================
build_image:
  stage: build
  tags:
    - docker
  image: docker:29.1
  services:
    - docker:29.1-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Login to private registry (VM3)"
    - docker login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"

    - echo "Build Docker image on runner (VM2)"
    - docker build -t "$FULL_IMAGE" .

    - echo "Push image to registry (VM3)"
    - docker push "$FULL_IMAGE"
  only:
    - main

# =========================
# DEPLOY STAGE (VM4)
# =========================
deploy_to_vm4:
  stage: deploy
  tags:
    - docker
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan deploy-region-d >> ~/.ssh/known_hosts
  script:
    - echo "Deploy to VM4 (deploy-region-d)"
    - |
      ssh mburmistrov@deploy-region-d << 'EOF'
        set -e
        cd ~/deploy/nginx
        docker login registry.internal:5000 \
          -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"
        docker compose pull
        docker compose up -d
        docker ps
      EOF
  only:
    - main
