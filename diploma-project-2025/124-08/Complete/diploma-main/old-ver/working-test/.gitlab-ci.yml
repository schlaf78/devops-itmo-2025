stages:
  - build
  - deploy

variables:
  REGISTRY: registry.internal:5000
  IMAGE_NAME: test/nginx
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  FULL_IMAGE: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

# =========================
# BUILD STAGE
# =========================
build_image:
  stage: build
  tags:
    - docker
  image: docker:29.1

  script:
    - echo "Login to private registry"
    - docker login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"

    - echo "Build image with tag $IMAGE_TAG"
    - docker build -t "$FULL_IMAGE" .

    - echo "Push image"
    - docker push "$FULL_IMAGE"

  only:
    - main


# =========================
# DEPLOY STAGE
# =========================
deploy_to_vm4:
  stage: deploy
  tags:
    - docker
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - cp /ssh/gitlab_runner_to_deploy ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan deploy-region-d >> ~/.ssh/known_hosts

  script:
    - |
      ssh mburmistrov@deploy-region-d << 'EOF'
        set -e

        cd ~/deploy/nginx

        echo "Login to registry"
        docker login registry.internal:5000 \
          -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"

        echo "Set image tag"
        export IMAGE_TAG=$CI_COMMIT_SHORT_SHA

        echo "Pull and recreate container"
        docker compose pull
        docker compose up -d --force-recreate

        docker ps
      EOF

  only:
    - main
