stages:
  - build
  - deploy

variables:
  REGISTRY: "registry.internal:5000"
  IMAGE_NAME: "test/app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  FULL_IMAGE: "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
  DEPLOY_HOST: "deploy-region-d"
  DEPLOY_USER: "mburmistrov"
  DEPLOY_DIR: "/home/mburmistrov/deploy/nginx"

build_image:
  stage: build
  tags:
    - docker
  image: docker:29.1
  script:
    - echo "[BUILD] login to registry"
    - docker login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"
    - echo "[BUILD] build image $FULL_IMAGE"
    - docker build -t "$FULL_IMAGE" app/
    - echo "[BUILD] push image $FULL_IMAGE"
    - docker push "$FULL_IMAGE"
  rules:
    # Автоматически запускаем на ветке main
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    # Во всех остальных случаях пусть job виден, но запускается вручную (на всякий)
    - when: manual

deploy_vm4:
  stage: deploy
  tags:
    - docker
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - cp /ssh/gitlab_runner_to_deploy ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_DIR"
    - scp docker-compose.yml nginx.conf "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "echo IMAGE_TAG=$CI_COMMIT_SHORT_SHA > $DEPLOY_DIR/.env"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "echo \"$REGISTRY_PASSWORD\" | docker login $REGISTRY -u \"$REGISTRY_USER\" --password-stdin"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_DIR && docker compose pull && docker compose up -d && docker ps"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual
