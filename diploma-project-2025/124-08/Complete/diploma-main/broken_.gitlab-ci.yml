stages:
  - build
  - deploy

variables:
  REGISTRY: "registry.internal:5000"
  IMAGE_NAME: "test/app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  FULL_IMAGE: "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

  DEPLOY_HOST: "deploy-region-d"
  DEPLOY_DIR: "/home/mburmistrov/deploy/nginx"

# -------------------------
# BUILD: собираем Docker image и пушим в private Registry (VM3)
# -------------------------
build_image:
  stage: build
  tags:
    - docker
  image: docker:29.1
  script:
    - 'echo "[BUILD] Login to registry"'
    - 'docker login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"'
    - 'echo "[BUILD] Build image: $FULL_IMAGE (context: app/)"'
    - 'docker build -t "$FULL_IMAGE" app/'
    - 'echo "[BUILD] Push image: $FULL_IMAGE"'
    - 'docker push "$FULL_IMAGE"'
  only:
    - main

# -------------------------
# DEPLOY: копируем compose+nginx.conf на VM4 и поднимаем 3 контейнера
# -------------------------
deploy_vm4:
  stage: deploy
  tags:
    - docker
  image: alpine:latest
  before_script:
    - 'apk add --no-cache openssh'
    - 'mkdir -p ~/.ssh'
    - 'cp /ssh/gitlab_runner_to_deploy ~/.ssh/id_ed25519'
    - 'chmod 600 ~/.ssh/id_ed25519'
    - 'ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts'
  script:
    - 'echo "[DEPLOY] Prepare dir on VM4"'
    - 'ssh mburmistrov@"$DEPLOY_HOST" "mkdir -p '"$DEPLOY_DIR"'"'
    - 'echo "[DEPLOY] Copy docker-compose.yml + nginx.conf to VM4"'
    - 'scp docker-compose.yml nginx.conf mburmistrov@"$DEPLOY_HOST":"'"$DEPLOY_DIR"'/"'
    - 'echo "[DEPLOY] Write .env with IMAGE_TAG on VM4"'
    - 'ssh mburmistrov@"$DEPLOY_HOST" "echo IMAGE_TAG=$CI_COMMIT_SHORT_SHA > '"$DEPLOY_DIR"'/.env"'
    - 'echo "[DEPLOY] Login to registry on VM4"'
    - 'ssh mburmistrov@"$DEPLOY_HOST" "docker login '"$REGISTRY"' -u '"$REGISTRY_USER"' -p '"$REGISTRY_PASSWORD"'"'
    - 'echo "[DEPLOY] docker compose pull + up (3 containers)"'
    - 'ssh mburmistrov@"$DEPLOY_HOST" "cd '"$DEPLOY_DIR"' && docker compose pull && docker compose up -d && docker ps"'
  only:
    - main
